name: XiaokeFloorplan
options:
  bundleIdPrefix: com.achir
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.3.0"
    CURRENT_PROJECT_VERSION: "10300"
targets:
  XiaokeFloorplan:
    type: application
    platform: iOS
    sources:
      - path: XiaokeFloorplan
      - path: web            # 和電腦版、線上版同一份網頁（sync.sh 從 ../dist 複製進來），整個資料夾放進 App
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.achir.xiaokefloorplan
        TARGETED_DEVICE_FAMILY: "1,2"     # iPhone 與 iPad
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 7BN6XJ59KP      # Apple Developer Program（個人）
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: XiaokeFloorplan/Info.plist
      properties:
        CFBundleDisplayName: 小柯平面圖3D
        CFBundleDevelopmentRegion: zh_TW
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: ""
        UIRequiresFullScreen: true
        # iPhone 直放（上面 3D、下面平面圖與指令）；iPad 四個方向都可以（橫放就是電腦版版面）
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIFileSharingEnabled: true
        NSMicrophoneUsageDescription: 用說的下指令修改 3D 模型（語音輸入）
        NSCameraUsageDescription: 直接拍攝平面圖來轉成 3D
        NSPhotoLibraryUsageDescription: 從照片選擇平面圖來轉成 3D
        LSSupportsOpeningDocumentsInPlace: true
schemes:
  XiaokeFloorplan:
    build:
      targets:
        XiaokeFloorplan: all
    run:
      config: Debug
    archive:
      config: Release
